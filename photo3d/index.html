<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SURESH³ - Cubic Photo Gallery</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Mona+Sans:ital,wght@0,200..900;1,200..900&display=swap');
        
        * { 
            box-sizing: border-box; 
            -webkit-font-smoothing: antialiased; 
            text-rendering: optimizeLegibility; 
            scroll-behavior: smooth;
        }
        
        html, body { 
            height: 100%; 
            overflow: hidden;
        }
        
        body {
            display: flex; 
            flex-direction: row; 
            flex-wrap: wrap;
            justify-content: center; 
            align-items: center; 
            margin: 0;
            --theme-clr: #fff;
            --text-color: #000;
            --button-bg: #1e1e1e;
            --button-text: #fff;
            --border-clr: #aaa;
            --overlay-bg: rgba(255, 255, 255, 0.8);
            font-family: "Mona Sans", sans-serif;
            background: var(--theme-clr);
            color: var(--text-color);
            transition: background 0.3s ease, color 0.3s ease;
        }

        body.dark-mode {
            --theme-clr: #121212;
            --text-color: #fff;
            --button-bg: #f5f5f5;
            --button-text: #121212;
            --border-clr: #555;
            --overlay-bg: rgba(30, 30, 30, 0.8);
        }

        /* Gallery Container */
        .gallery-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* Dark Mode Toggle */
        .dark-mode-toggle {
            position: absolute;
            right: 1em;
            top: 1em;
            z-index: 102;
            background: var(--button-bg);
            color: var(--button-text);
            border: 1px solid var(--border-clr);
            padding: 6px 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }

        .dark-mode-toggle:hover {
            box-shadow: inset 0 0 8px 1px var(--button-text),
                        inset 0 0 0 1px var(--button-text);
        }

        /* Cubic Gallery Styles */
        .inf-grid-hero-container {
            height: 100vh;
            width: 100vw;
            perspective: 1000px;
            position: relative;
            --sz: 1800px;
            --grid-sz: 0;
            --rev-dis: 0;
        }

        .inf-grid-hero-container > div {
            position: absolute;
            width: 100%; 
            height: 100%;
            transform-style: preserve-3d;
            display: grid; 
            place-items: center;
            z-index: 1;
        }

        .inf-grid-hero-container > div::after {
            content: ''; 
            display: block;
            height: 100%;
            background: var(--theme-clr);
            position: absolute; 
            left: 0; 
            right: 0; 
            top: 0; 
            bottom: 0;
            pointer-events: none;
            z-index: 3;
            transition: background 0.3s ease;
        }

        .inf-grid-hero-container > div {
            display: grid;
            grid-template-columns: repeat(var(--grid-sz), 1fr);
            grid-template-rows: repeat(var(--grid-sz), 1fr);
            gap: 6px;
        }

        .inf-grid-hero-container > div > div {
            width: 100%; 
            height: 100%;
            background-size: cover !important;
            background-position: center !important;
            background: repeating-linear-gradient(45deg, 
                        rgba(148, 164, 194, 0.07) 0%, 
                        rgba(148, 164, 194, 0.07) 5%, 
                        transparent 5%, 
                        transparent 10%);
            opacity: 0;
        }

        .inf-grid-hero-container > div > div:hover {
            border: 4px solid var(--text-color);
            cursor: pointer;
        }

        .inf-grid-hero-container > div > div.loaded {
            transition: transform 0.4s ease-out, opacity 0.4s ease-out;
            transform-style: preserve-3d;
            opacity: 1;
            z-index: 2;
            transform: translate3d(0, 0, -1px) !important;
        }

        /* Face-specific styles */
        .inf-grid-hero-container > div.top {
            top: 0;
            transform-origin: top center;
            transform: rotateX(-90deg);
            height: var(--sz);
            perspective: 1000px;
        }

        .inf-grid-hero-container > div.top::after { 
            background: linear-gradient(180deg, transparent, var(--theme-clr) calc(1% * (100 - var(--rev-dis)))); 
        }

        .inf-grid-hero-container > div.top .shift-away { 
            translate: 0% 100%;
        }

        .inf-grid-hero-container > div.top > div { 
            transform: translate3d(0, 0, -100vh); 
        }

        .inf-grid-hero-container > div.left {
            left: 0; 
            transform-origin: center left;
            transform: rotateY(90deg); 
            width: var(--sz);
        }

        .inf-grid-hero-container > div.left::after { 
            background: linear-gradient(90deg, transparent, var(--theme-clr) calc(1% * (100 - var(--rev-dis)))); 
        }

        .inf-grid-hero-container > div.left .shift-away { 
            translate: 100% 0%;
        }

        .inf-grid-hero-container > div.left > div { 
            transform: translate3d(0, 0, -50vw); 
        }

        .inf-grid-hero-container > div.bottom {
            bottom: 0; 
            transform-origin: bottom center;
            transform: rotateX(90deg); 
            height: var(--sz);
        }

        .inf-grid-hero-container > div.bottom::after { 
            background: linear-gradient(0deg, transparent, var(--theme-clr) calc(1% * (100 - var(--rev-dis)))); 
        }

        .inf-grid-hero-container > div.bottom .shift-away { 
            translate: 0% -100%;
        }

        .inf-grid-hero-container > div.bottom > div { 
            transform: translate3d(0, 0, -50vh); 
        }

        .inf-grid-hero-container > div.right {
            right: 0; 
            transform-origin: center right;
            transform: rotateY(-90deg); 
            width: var(--sz);
        }

        .inf-grid-hero-container > div.right::after { 
            background: linear-gradient(270deg, transparent, var(--theme-clr) calc(1% * (100 - var(--rev-dis)))); 
        }

        .inf-grid-hero-container > div.right .shift-away { 
            translate: -100% 0%;
        }

        .inf-grid-hero-container > div.right > div { 
            transform: translate3d(0, 0, -50vw); 
        }

        /* Content styles */
        .content {
            position: absolute;
            width: 34%; 
            height: 34%;
            left: 0; 
            right: 0; 
            top: 0; 
            bottom: 0;
            border-radius: 8px;
            backdrop-filter: blur(3px);
            background: var(--overlay-bg);
            margin: auto;
            justify-content: center;
            display: flex;
            align-items: center;
            flex-direction: column;
            z-index: 5;
            transition: background 0.3s ease;
        }

        .content h2 {
            font-size: 3em;
            font-weight: 600;
            z-index: 1;
            color: var(--text-color);
            user-select: none;
            margin:0;
        }

        .content p {
            margin-top: 0;
            color: var(--text-color);
            font-weight: 500;
            text-align: center;
        }

        .content span { 
            color: orangered; 
        }

        .content div.button {
            background: var(--button-bg); 
            color: var(--button-text);
            padding: 6px 42px 8px 42px;
            border-radius: 12px; 
            text-decoration: none; 
            cursor: pointer;
            transition: box-shadow 0.2s ease-in-out;
            border: 1px solid var(--border-clr);
        }

        .content div.button:hover {
            box-shadow: inset 0 0 8px 1px var(--button-text),
                        inset 0 0 0 1px var(--button-text);
        }

        /* Selection states */
        body:has(div.selectedPane) div.content {
            transition: opacity 0.4s ease-in-out;
            opacity: 0;
            z-index: -1;
        }

        .inf-grid-hero-container > div.selectedPane {
            transform: rotateX(0deg);
            width: 100vw; 
            height: 100vh;
            z-index: 100;
            transition: all 1s ease-in-out;
            position: absolute;
        }

        .inf-grid-hero-container > div.selectedPane::after {
            background: none;
        }

        .inf-grid-hero-container > div.selectedPane > div.selected { 
            top: 0; 
        }

        .inf-grid-hero-container > div.selectedPane > div { 
            opacity: 0; 
        }

        .inf-grid-hero-container > div.selectedPane > div.selected {
            transition: all 1s ease-in-out;
            rotate: 90deg 90deg;
            transform: translate3d(0, 100px, 0);
            position: absolute;
            z-index: 100;
            opacity: 0;
            animation: fadeIn 1s forwards;
            width: 100%; 
            height: 100%;
            background-repeat: no-repeat !important;
            cursor: default;
        }

        .inf-grid-hero-container > div.selectedPane > div.selected:hover {
            border: none;
        }

        @keyframes fadeIn { 
            to { opacity: 1; }
        }

        /* Back button */
        div#back-btn {
            position: absolute;
            left: 1em; 
            top: 1em;
            border: 1px solid var(--border-clr);
            z-index: 101;
            background: var(--button-bg); 
            color: var(--button-text);
            padding: 6px 42px 8px 42px;
            border-radius: 12px; 
            text-decoration: none; 
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            opacity: 0;
            pointer-events: none;
        }

        div#back-btn:hover {
            box-shadow: inset 0 0 8px 1px var(--button-text),
                        inset 0 0 0 1px var(--button-text);
        }

        body:has(div.selectedPane) div#back-btn {
            opacity: 1;
            pointer-events: all;
        }

        body:has(div.selectedPane) div.tp-dfwv {
            display: none;
        }
    </style>
</head>
<body>
    <div class="gallery-container">
        <!-- Dark Mode Toggle -->
        <button class="dark-mode-toggle" id="darkModeToggle">
            <i class="fas fa-moon"></i> Dark Mode
        </button>
        
        <!-- Cubic Gallery -->
        <div class="inf-grid-hero-container" id="main">
            <div class="right"></div>
            <div class="bottom"></div>
            <div class="left"></div>
            <div class="top"></div>
        </div>
        
        <!-- Content Overlay -->
        <div class="content">
            <h2>SURESH<span>³</span></h2>
            <p>A <span>cinema cubic click</span> photo gallery</p>
            <div class="button">click</div>
        </div>
        
        <!-- Back Button -->
        <div id="back-btn">Back to Gallery</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/locomotive-scroll@4.1.4/dist/locomotive-scroll.min.js"></script>
    <script>
        // Initialize Locomotive Scroll
        const scroll = new LocomotiveScroll({
            el: document.querySelector('#main'),
            smooth: true
        });

        // Dark Mode Toggle
        const darkModeToggle = document.getElementById('darkModeToggle');
        darkModeToggle.addEventListener('click', function() {
            document.body.classList.toggle('dark-mode');
            
            // Update button text and icon
            if (document.body.classList.contains('dark-mode')) {
                darkModeToggle.innerHTML = '<i class="fas fa-sun"></i> Light Mode';
            } else {
                darkModeToggle.innerHTML = '<i class="fas fa-moon"></i> Dark Mode';
            }
        });

        // Check for saved preference or system preference
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.body.classList.add('dark-mode');
            darkModeToggle.innerHTML = '<i class="fas fa-sun"></i> Light Mode';
        }

        // Sample image data (would normally come from API)
        const imageData = [
            { src: 'https://source.unsplash.com/random/800x600?portrait', title: 'Portrait 1' },
            { src: 'https://source.unsplash.com/random/800x600?landscape', title: 'Landscape 1' },
            { src: 'https://source.unsplash.com/random/800x600?abstract', title: 'Abstract 1' },
            { src: 'https://source.unsplash.com/random/800x600?city', title: 'Urban 1' }
        ];

        // Populate gallery with images
        function initGallery() {
            const faces = document.querySelectorAll('.inf-grid-hero-container > div');
            faces.forEach(face => {
                // Set grid size based on image count
                face.style.setProperty('--grid-sz', Math.ceil(Math.sqrt(imageData.length)));
                
                // Create grid items
                for (let i = 0; i < imageData.length; i++) {
                    const gridItem = document.createElement('div');
                    gridItem.style.backgroundImage = `url(${imageData[i].src})`;
                    gridItem.dataset.title = imageData[i].title;
                    
                    // Add click handler
                    gridItem.addEventListener('click', function() {
                        face.classList.add('selectedPane');
                        gridItem.classList.add('selected');
                    });
                    
                    // Simulate loading
                    setTimeout(() => {
                        gridItem.classList.add('loaded');
                    }, 100 * i);
                    
                    face.appendChild(gridItem);
                }
            });
        }

        // Back button functionality
        document.getElementById('back-btn').addEventListener('click', function() {
            const selectedPane = document.querySelector('.selectedPane');
            if (selectedPane) {
                selectedPane.classList.remove('selectedPane');
                document.querySelector('.selected').classList.remove('selected');
            }
        });

        // Initialize the gallery
        window.addEventListener('load', initGallery);
    </script>
</body>
</html>
